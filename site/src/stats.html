<!doctype html>
<html lang="{{@lang}}" class="l-{{@lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{stats_title}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0D">
<meta name="color-scheme" content="dark">
<link rel="icon" href="{{@root}}assets/icon.svg" type="image/svg+xml">
<style>{{@inc:styles.css}}{{@inc:stats.css}}</style>
</head>
<body>

<header class="nav scrolled" id="nav">
  <a class="brand" href="{{@site_home}}" aria-label="BLACKWALL">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1C1C20"/><path d="M3 24.5 29 8.5" stroke="#F2F2F3" stroke-width="2.4"/></svg>
    <span>BLACKWALL</span>
  </a>
  <div class="nav-r">
    <div class="seg" role="group" aria-label="{{lang_label}}">
      <a href="{{@href_en}}" data-lang="en" lang="en"{{@cur_en}}>EN</a>
      <a href="{{@href_ru}}" data-lang="ru" lang="ru"{{@cur_ru}}>RU</a>
      <a href="{{@href_zh}}" data-lang="zh" lang="zh"{{@cur_zh}}>中文</a>
    </div>
  </div>
</header>

<main class="stats" id="stats"
  data-days="{{stats_days}}" data-views="{{stats_views}}" data-uniques="{{stats_uniques}}"
  data-off="{{stats_off}}" data-err="{{stats_err}}" data-empty="{{stats_empty}}">
  <div class="wrap">
    <div class="st-head">
      <h1 class="st-h">{{stats_h}}</h1>
      <div class="seg" id="period" role="group">
        <button type="button" data-d="7">7</button>
        <button type="button" data-d="30" aria-pressed="true">30</button>
        <button type="button" data-d="90">90</button>
      </div>
    </div>

    <form class="st-key" id="key" hidden>
      <input type="password" id="key-in" placeholder="{{stats_key}}" aria-label="{{stats_key}}" autocomplete="off">
      <button class="btn btn-s" type="submit">{{stats_open}}</button>
    </form>
    <p class="st-msg" id="msg" hidden></p>

    <div id="body" hidden>
      <div class="tiles">
        <div class="tile"><span>{{stats_views}}</span><b id="t-views">0</b></div>
        <div class="tile"><span>{{stats_uniques}}</span><b id="t-uniques">0</b></div>
        <div class="tile"><span>{{stats_downloads}}</span><b id="t-dl">0</b></div>
      </div>

      <section class="panel">
        <div class="panel-h">
          <h2>{{stats_daily}}</h2>
          <div class="legend"><span class="k k1">{{stats_views}}</span><span class="k k2">{{stats_uniques}}</span></div>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <div class="lists">
        <section class="panel"><h2>{{stats_country}}</h2><div class="rows" data-dim="country"></div></section>
        <section class="panel"><h2>{{stats_ref}}</h2><div class="rows" data-dim="ref"></div></section>
        <section class="panel"><h2>{{stats_lang}}</h2><div class="rows" data-dim="lang"></div></section>
        <section class="panel"><h2>{{stats_os}}</h2><div class="rows" data-dim="os"></div></section>
        <section class="panel"><h2>{{stats_device}}</h2><div class="rows" data-dim="device"></div></section>
        <section class="panel"><h2>{{stats_dl}}</h2><div class="rows" data-dim="dl"></div></section>
      </div>
    </div>
  </div>
</main>

<script id="bw" type="application/json">{{@data}}</script>
<script>{{@inc:stats.js}}</script>
</body>
</html>
