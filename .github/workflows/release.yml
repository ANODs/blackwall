name: Release

# One app, one codebase, three languages. A v<version> tag (or "Run workflow", which then creates
# the tag) builds every language for every platform and publishes three GitHub releases:
#   v<version>-en  "BLACKWALL <version>"            notes: docs/releases/<version>/en.md  (marked Latest)
#   v<version>-ru  "BLACKWALL <version> — Русский"  notes: docs/releases/<version>/ru.md
#   v<version>-zh  "BLACKWALL <version> — 中文"      notes: docs/releases/<version>/zh.md
# The version is in build.zig.zon. Every language needs its own notes file, or nothing is published.
# Platforms: macOS (arm64), Windows (x86_64), Linux (x86_64), and one Android APK (arm64 and
# x86_64, every language inside) attached to each of the three releases.
# Android (docs/android.md): the APK must be signed with the same key in every release, so it is
# built only when the secrets BLACKWALL_ANDROID_KEYSTORE (the keystore, base64),
# BLACKWALL_ANDROID_KEYSTORE_PASS and BLACKWALL_ANDROID_KEYSTORE_ALIAS are set.
# Auto-update (docs/updates.md): with the secret BLACKWALL_UPDATE_KEY and the variable
# BLACKWALL_UPDATE_PUBKEY set, the apps are built with the updater and every file gets a
# "<file>.sig". Without them the release is still built and published, without auto-update.
# Google Play (docs/android.md): with the secret PLAY_SERVICE_ACCOUNT_JSON set, the App Bundle
# of the same build goes to the Play track PLAY_TRACK. It runs beside the GitHub releases:
# a Play failure fails its own job and nothing else.

on:
  push:
    # Only plain versions: the per-language tags created below must not start another run.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.1
  # both halves of the update key pair, or neither: the updater is on only when both are set
  # the public key may live among the variables or among the secrets: it is no secret,
  # but people put the two halves next to each other
  UPDATE_PUBKEY: ${{ vars.BLACKWALL_UPDATE_PUBKEY || secrets.BLACKWALL_UPDATE_PUBKEY }}
  HAS_UPDATE_KEY: ${{ secrets.BLACKWALL_UPDATE_KEY != '' }}
  # Google Play: alpha is "Closed testing - Alpha"; production once Play has opened it
  PLAY_TRACK: alpha
  # Google's bundletool, for the App Bundle (github.com/google/bundletool/releases)
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",.*/\1/p' build.zig.zon)
          test -n "$version" || { echo "::error::no version in build.zig.zon"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but build.zig.zon has version $version"
            exit 1
          fi
          for lang in en ru zh; do
            test -f "docs/releases/$version/$lang.md" || { echo "::error::missing docs/releases/$version/$lang.md"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test

  # Every language × platform. Windows and Linux are cross-built on Linux (Zig ships the libcs);
  # macOS needs a Mac for codesign and ditto. Explicit targets keep the CPU baseline portable.
  build:
    name: Build ${{ matrix.lang }} ${{ matrix.platform.name }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        lang: [en, ru, zh]
        platform:
          # macOS builds for the machine it runs on: an explicit target makes Zig treat the
          # build as a cross build, and then the SDK's own libraries (libobjc) are not found.
          # The CPU is fixed to the oldest Apple Silicon instead.
          - { name: macos, runner: macos-latest, target: -Dcpu=apple_m1 }
          - { name: windows, runner: ubuntu-latest, target: -Dtarget=x86_64-windows }
          - { name: linux, runner: ubuntu-latest, target: -Dtarget=x86_64-linux-gnu }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Windows: the app carries wintun.dll (the WireGuard project's signed driver library,
      # www.wintun.net), pinned by its hash
      - name: Wintun
        if: matrix.platform.name == 'windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wintun.zip" https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  $RUNNER_TEMP/wintun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/wintun.zip" -d "$RUNNER_TEMP"
          echo "WINTUN_ARG=-Dwintun=$RUNNER_TEMP/wintun/bin/amd64/wintun.dll" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          # the macOS package signs the root helper inside the app with it, so installed
          # helpers can replace themselves without the administrator (docs/updates.md)
          BLACKWALL_UPDATE_KEY: ${{ secrets.BLACKWALL_UPDATE_KEY }}
        run: |
          # without the keys (a fork) the apps take no updates at all, not
          # even the default ones from the upstream repository
          update=("-Dupdate-repo=")
          if [ -n "$UPDATE_PUBKEY" ] && [ "$HAS_UPDATE_KEY" = true ]; then
            update=("-Dupdate-repo=$GITHUB_REPOSITORY" "-Dupdate-pubkey=$UPDATE_PUBKEY")
          else
            echo "::warning::BLACKWALL_UPDATE_KEY / BLACKWALL_UPDATE_PUBKEY not set: built without auto-update"
          fi
          extra=()
          if [ -n "${WINTUN_ARG:-}" ]; then extra=("$WINTUN_ARG"); fi
          zig build package -Dlang=${{ matrix.lang }} ${{ matrix.platform.target }} -Doptimize=ReleaseSafe "${update[@]}" "${extra[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.lang }}-${{ matrix.platform.name }}
          path: zig-out/package/*
          if-no-files-found: error

  # The runner's image has the Android SDK, an NDK and JDK 17. Without the keystore the job
  # succeeds with nothing to upload, and the releases are published without Android.
  android:
    name: Build android
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.BLACKWALL_ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
      - if: env.HAS_KEYSTORE != 'true'
        run: echo '::warning::BLACKWALL_ANDROID_KEYSTORE is not set, so this release has no Android package'
      - uses: mlugg/setup-zig@v2
        if: env.HAS_KEYSTORE == 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Package
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.BLACKWALL_ANDROID_KEYSTORE }}
          BLACKWALL_ANDROID_KEYSTORE_PASS: ${{ secrets.BLACKWALL_ANDROID_KEYSTORE_PASS }}
          BLACKWALL_ANDROID_KEYSTORE_ALIAS: ${{ secrets.BLACKWALL_ANDROID_KEYSTORE_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          export BLACKWALL_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          # the App Bundle for Google Play comes from the same build, signed with the same key
          export BLACKWALL_BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$BLACKWALL_BUNDLETOOL" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $BLACKWALL_BUNDLETOOL" | sha256sum -c -
          zig build android android-bundle -Doptimize=ReleaseSafe
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-android
          path: zig-out/package/*.apk
          if-no-files-found: ignore
      # not attached to the releases: only Google Play takes it
      - uses: actions/upload-artifact@v7
        with:
          name: play-android
          path: zig-out/package/*.aab
          if-no-files-found: ignore

  # The App Bundle to Google Play (tools/play_upload.py). Without the service account's key,
  # or without the bundle (no keystore), it warns and succeeds.
  play:
    name: Google Play
    needs: [version, android]
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - if: env.HAS_PLAY_KEY != 'true'
        run: echo '::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, so this release is not uploaded to Google Play'
      - uses: actions/checkout@v7
        if: env.HAS_PLAY_KEY == 'true'
      - uses: actions/download-artifact@v8
        if: env.HAS_PLAY_KEY == 'true'
        continue-on-error: true  # no artifact when there was no keystore; the next step says so
        with:
          name: play-android
          path: play
      - name: Upload
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          aab="play/BLACKWALL-$VERSION-android.aab"
          if [ ! -f "$aab" ]; then
            echo "::warning::no App Bundle was built (BLACKWALL_ANDROID_KEYSTORE not set), nothing for Google Play"
            exit 0
          fi
          python3 tools/play_upload.py "$aab" "$VERSION" "$PLAY_TRACK"

  publish:
    name: Publish ${{ matrix.lang }}
    needs: [version, build, android]
    strategy:
      # one release after another, so "Latest" ends up on the English one
      max-parallel: 1
      matrix:
        include:
          - { lang: zh, title: "BLACKWALL ${{ needs.version.outputs.version }} — 中文", latest: false }
          - { lang: ru, title: "BLACKWALL ${{ needs.version.outputs.version }} — Русский", latest: false }
          - { lang: en, title: "BLACKWALL ${{ needs.version.outputs.version }}", latest: true }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-${{ matrix.lang }}-*
          path: dist
          merge-multiple: true
      # the same APK goes into every language's release (there is none without the keystore)
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-android
          path: dist
          merge-multiple: true
      - uses: mlugg/setup-zig@v2
        if: env.UPDATE_PUBKEY != '' && env.HAS_UPDATE_KEY == 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Sign for the updater
        if: env.UPDATE_PUBKEY != '' && env.HAS_UPDATE_KEY == 'true'
        env:
          BLACKWALL_UPDATE_KEY: ${{ secrets.BLACKWALL_UPDATE_KEY }}
          BLACKWALL_UPDATE_PUBKEY: ${{ vars.BLACKWALL_UPDATE_PUBKEY || secrets.BLACKWALL_UPDATE_PUBKEY }}
        run: |
          zig build sign -Doptimize=ReleaseSafe
          files=(dist/BLACKWALL-*)
          zig-out/bin/blackwall-sign sign "${files[@]}"
          # the secret and the variable must be one key pair, or clients would reject the release
          zig-out/bin/blackwall-sign verify "${files[@]}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum BLACKWALL-* > SHA256SUMS.txt)
          gh release create "v$VERSION-${{ matrix.lang }}" dist/* \
            --title "${{ matrix.title }}" \
            --notes-file "docs/releases/$VERSION/${{ matrix.lang }}.md" \
            --target "$GITHUB_SHA" \
            --latest=${{ matrix.latest }}
