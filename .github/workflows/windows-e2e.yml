name: Windows end-to-end

# On a real Windows machine of CI (an administrator, nothing of value on it):
# the socket layer, the whole suite, then tools/windows/e2e.ps1 with the
# Wintun adapter, routes per application, the system service and the kill
# switch on WFP.

on:
  push:
    branches: [main, windows]
    paths-ignore: ['site/**', 'worker/**', 'docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Windows end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig test src/core/afd.zig
      - run: zig build test --summary failures
        timeout-minutes: 20
      - name: Wintun
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile $env:RUNNER_TEMP\wintun.zip
          $h = (Get-FileHash $env:RUNNER_TEMP\wintun.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256 $h"
          if ($h -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'wintun.zip is not the expected file' }
          Expand-Archive $env:RUNNER_TEMP\wintun.zip -DestinationPath $env:RUNNER_TEMP\wintun
      - run: zig build -Doptimize=ReleaseSafe "-Dwintun=$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll"
      - run: Copy-Item $env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll zig-out\bin\
      - run: pwsh tools/windows/e2e.ps1 -Bin zig-out\bin
      - run: pwsh tools/windows/upgrade.ps1 -Wintun $env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll
